name: Keep the server awake
# Render's free plan sleeps after 15 quiet minutes, and its first answer after that takes up to a minute.
# This visits /health every 10 minutes from 06:00 to 22:00 Zambia time (04:00-20:00 UTC), when people use ScreenGuide.
# That uses about 480 of Render's 750 free hours a month. To stop it: Actions > Keep the server awake > Disable workflow.
on:
  schedule:
    - cron: "*/10 4-19 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -sS -o /dev/null -w "health %{http_code} in %{time_total}s\n" --max-time 120 https://screen-guide-server.onrender.com/health || true
