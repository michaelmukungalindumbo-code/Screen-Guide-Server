name: Check the server
# Opens /version once and prints how long the server took to answer (about 30 s means it was asleep) and which version is
# live. Run it by hand: Actions > Check the server > Run workflow. It no longer runs on a timer: Render's staff say
# keeping a free service awake is against their rules (4 Nov), and Render turned such visits away anyway.
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          curl -sS -o v.json -w "version %{http_code} in %{time_total}s\n" --max-time 120 https://screen-guide-server.onrender.com/version || true
          python3 -c "import json; d = json.load(open('v.json')); print('server', d.get('server'), 'prompts', d.get('prompts'))" || true
